<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Color Sort</title>
  <meta name="description" content="Pixel Color Sort: a neon color-sorting puzzle game with 200 levels and a daily challenge.">
  <link rel="icon" href="icon.png">
  <style>
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#060918; color:#E6ECFF; line-height:1.6; }
    main { max-width:34rem; margin:0 auto; padding:3rem 1.25rem; text-align:center; }
    img { width:96px; height:96px; border-radius:22px; }
    h1 { margin:1rem 0 .25rem; color:#fff; }
    p { color:#C9D3F5; }
    .btn { display:inline-block; margin:.35rem; padding:.8rem 1.4rem; border-radius:10px; font-weight:bold; text-decoration:none; }
    .play { background:#3DDCFF; color:#060918; }
    .ios { background:#A855F7; color:#fff; }
    footer { margin-top:2.5rem; font-size:.9rem; }
    footer a { color:#3DDCFF; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="Pixel Color Sort icon">
    <h1>Pixel Color Sort</h1>
    <p>Pour, stack and sort the neon. 200 levels, six worlds and a new Daily Challenge every day.</p>
    <a class="btn play" href="https://play.google.com/store/apps/details?id=com.lexnemesis.pixelcolorsort">Get it on Google Play</a>
    <a class="btn ios" href="https://apps.apple.com/us/app/pixel-color-sort/id6824477699">Download on the App Store</a>
    <footer><a href="privacy.html">Privacy Policy</a></footer>
  </main>

</html>
